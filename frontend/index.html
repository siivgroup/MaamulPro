        <title>MaamulPro</title>
        <style>
            @page { size: A4 portrait; margin: 0; }
            @media print {
                html, body { margin: 0 !important; padding: 0 !important; }
                body {
                    print-color-adjust: exact !important;
                    -webkit-print-color-adjust: exact !important;
                }
                aside, header, .main-header, .sidebar, nav { display: none !important; }
                .main-content, main, .content, #app {
                    margin: 0 !important; padding: 0 !important; width: 100% !important; max-width: 100% !important;
                }
                .print-sheet {
                    box-shadow: none !important;
                    border: 1.5px solid #94a3b8 !important;
                    border-radius: 3px !important;
                    margin: 8mm !important;
                    padding: 10mm !important;
                    box-sizing: border-box !important;
                    width: calc(100% - 16mm) !important;
                    max-width: calc(100% - 16mm) !important;
                }
                table { width: 100% !important; border-collapse: collapse !important; }
                table thead tr {
                    background: #1e3a5f !important;
                    print-color-adjust: exact !important; -webkit-print-color-adjust: exact !important;
                }
                table th {
                    color: white !important; padding: 8px 12px !important; font-size: 10.5px !important;
                    font-weight: 700 !important; text-transform: uppercase !important;
                    letter-spacing: 0.04em !important; text-align: left !important;
                }
                table td { padding: 7px 12px !important; font-size: 11.5px !important; border-bottom: 1px solid #e2e8f0 !important; }
                table tbody tr:nth-child(even) {
                    background: #f0f4f8 !important;
                    print-color-adjust: exact !important; -webkit-print-color-adjust: exact !important;
                }
                table tfoot tr {
                    background: #e8edf4 !important; font-weight: 700 !important;
                    print-color-adjust: exact !important; -webkit-print-color-adjust: exact !important;
                }
                table tfoot td { border-top: 2px solid #cbd5e1 !important; border-bottom: none !important; }
            }
        </style>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
